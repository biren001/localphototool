<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0d18"/>
      <stop offset="1" stop-color="#141a2e"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="0.55" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.15" r="0.9">
      <stop offset="0" stop-color="#4f46e5" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- decorative frame -->
  <g opacity="0.18" stroke="#8b93b8" stroke-width="2" fill="none">
    <circle cx="1080" cy="120" r="150"/>
    <circle cx="1080" cy="120" r="110"/>
    <circle cx="1080" cy="120" r="70"/>
  </g>

  <!-- brand mark -->
  <g transform="translate(84,86)">
    <rect width="76" height="76" rx="20" fill="url(#brand)"/>
    <g fill="none" stroke="#ffffff" stroke-width="5.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 27v-5a2 2 0 0 1 2-2h13"/>
      <path d="M54 36v16a2 2 0 0 1-2 2H30"/>
      <path d="m30 40 6-7 6 6"/>
      <path d="M42 33v16"/>
    </g>
  </g>
  <text x="180" y="132" fill="#eef1f9" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="-0.5">LocalPhotoTool.com</text>

  <!-- headline -->
  <text x="84" y="272" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="800" letter-spacing="-2">Compress images</text>
  <text x="84" y="352" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="800" letter-spacing="-2">without uploading them</text>
  <text x="86" y="412" fill="#9aa3bd" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="27" font-weight="400">Private, in-browser compression with measured quality control.</text>

  <!-- stat bars -->
  <g transform="translate(84,470)">
    <text x="0" y="0" fill="#eef1f9" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="700">−85%</text>
    <rect x="0" y="14" width="330" height="8" rx="4" fill="#242c45"/>
    <rect x="0" y="14" width="280" height="8" rx="4" fill="url(#bar1)"/>
    <text x="0" y="54" fill="#7c85a3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18">4.1 MB → 612 KB · nothing uploaded</text>
  </g>
  <g transform="translate(470,470)">
    <text x="0" y="0" fill="#eef1f9" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="700">−89%</text>
    <rect x="0" y="14" width="330" height="8" rx="4" fill="#242c45"/>
    <rect x="0" y="14" width="294" height="8" rx="4" fill="url(#bar1)"/>
    <text x="0" y="54" fill="#7c85a3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18">PNG-8 quantizer · 256 colours</text>
  </g>
  <g transform="translate(856,470)">
    <text x="0" y="0" fill="#eef1f9" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="700">100%</text>
    <rect x="0" y="14" width="280" height="8" rx="4" fill="#242c45"/>
    <rect x="0" y="14" width="280" height="8" rx="4" fill="url(#bar1)"/>
    <text x="0" y="54" fill="#7c85a3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18">processed on your device</text>
  </g>

  <!-- badge -->
  <g transform="translate(84,540)">
    <rect width="298" height="44" rx="22" fill="#10b981" fill-opacity="0.14" stroke="#10b981" stroke-opacity="0.5"/>
    <circle cx="24" cy="22" r="6" fill="#34d399"/>
    <text x="42" y="30" fill="#6ee7b7" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="600">Free · no account · no watermark</text>
  </g>
</svg>
